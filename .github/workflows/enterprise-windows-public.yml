name: Enterprise Edition - Windows (Public CI)

on:
  push:
    branches: [enterprise]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64 - MSVC Debug
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      TBUILD: ${{ github.workspace }}\TBuild
      REPO: telega
      API_ID: 17349
      API_HASH: 344583e45741c457fe1862106095a5eb

    defaults:
      run:
        shell: cmd

    steps:
      - name: Create TBuild directory tree
        shell: pwsh
        run: |
          foreach ($d in @(
            "$env:TBUILD\Libraries\win64\cache_keys",
            "$env:TBUILD\ThirdParty\cache_keys"
          )) { New-Item -ItemType Directory -Force $d | Out-Null }

      # Use upstream tdesktop v7.0.4 which has all submodules correctly indexed.
      # Our fork is missing all gitlinks (git ls-tree shows no 160000 entries),
      # so submodules: recursive on our fork produces empty directories.
      - name: Checkout upstream tdesktop v7.0.4
        uses: actions/checkout@v4
        with:
          repository: telegramdesktop/tdesktop
          ref: v7.0.4
          submodules: true
          path: TBuild\${{ env.REPO }}


      - name: Compute dependency cache key
        shell: pwsh
        run: |
          $h = (Get-FileHash `
            "$env:TBUILD\$env:REPO\Telegram\build\prepare\prepare.py" `
            -Algorithm SHA256).Hash.ToLower()
          "DEPS_KEY=win64-$h" | Out-File -Append $env:GITHUB_ENV

      - name: Restore ThirdParty cache
        id: c-tp
        uses: actions/cache@v4
        with:
          path: TBuild\ThirdParty
          key: ${{ env.DEPS_KEY }}-thirdparty

      - name: Restore libraries cache (no Qt)
        id: c-libs
        uses: actions/cache@v4
        with:
          path: |
            TBuild\Libraries\win64
            !TBuild\Libraries\win64\Qt-*
          key: ${{ env.DEPS_KEY }}-libs

      - name: Restore Qt cache
        id: c-qt
        uses: actions/cache@v4
        with:
          path: TBuild\Libraries\win64\Qt-*
          key: ${{ env.DEPS_KEY }}-qt

      - name: Save ThirdParty cache
        if: steps.c-tp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: TBuild\ThirdParty
          key: ${{ env.DEPS_KEY }}-thirdparty

      - name: Save libraries cache (no Qt)
        if: steps.c-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            TBuild\Libraries\win64
            !TBuild\Libraries\win64\Qt-*
          key: ${{ env.DEPS_KEY }}-libs

      - name: Save Qt cache
        if: steps.c-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: TBuild\Libraries\win64\Qt-*
          key: ${{ env.DEPS_KEY }}-qt

      - name: Setup MSVC x64 Native Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Install Python helpers
        shell: pwsh
        run: pip install pywin32 six --quiet

      - name: Build / verify dependencies
        working-directory: TBuild\${{ env.REPO }}
        run: python Telegram\build\prepare\prepare.py skip-release silent

      # Apply enterprise files AFTER prepare.py so they are never overwritten.
      - name: Apply enterprise changes
        shell: pwsh
        run: |
          $dst  = "$env:TBUILD\$env:REPO"
          $base = "https://raw.githubusercontent.com/viper2288/telega/enterprise"
          $files = @(
            "Telegram/SourceFiles/enterprise/enterprise_broadcast.cpp",
            "Telegram/SourceFiles/enterprise/enterprise_broadcast.h",
            "Telegram/SourceFiles/settings/sections/settings_advanced.cpp",
            "Telegram/SourceFiles/history/view/history_view_context_menu.cpp",
            "Telegram/CMakeLists.txt"
          )
          foreach ($f in $files) {
            $url  = "$base/$f"
            $dest = "$dst\$($f.Replace('/', '\'))"
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            Write-Host "Downloading $f ..."
            Invoke-WebRequest $url -OutFile $dest -UseBasicParsing
            Write-Host "OK: $(Get-Item $dest | Select-Object -Expand Length) bytes"
          }
          $ctxMenu = "$dst\Telegram\SourceFiles\history\view\history_view_context_menu.cpp"
          if (-not (Select-String -Quiet -Pattern "AddBroadcastToGroupsAction" $ctxMenu)) {
            Write-Error "FATAL: history_view_context_menu.cpp missing AddBroadcastToGroupsAction"
            exit 1
          }
          Write-Host "Verified: AddBroadcastToGroupsAction present in context menu file"

      - name: CMake configure
        run: |
          set LIBS=%TBUILD%\Libraries\win64
          for /d %%Q in ("%LIBS%\Qt-5*") do set QT_DIR=%%Q
          if not defined QT_DIR (
            echo ERROR: Qt not found
            exit /b 1
          )
          echo Found Qt: %QT_DIR%
          for %%F in ("%QT_DIR%") do set QT_VER=%%~nxF
          set QT_VER=%QT_VER:Qt-=%
          set QT=%QT_VER%
          echo Qt version: %QT_VER%
          cmake "%TBUILD%\%REPO%" -B "%TBUILD%\%REPO%\out" -G "Ninja Multi-Config" -D CMAKE_CONFIGURATION_TYPES=Debug -D DESKTOP_APP_SPECIAL_TARGET=win64 -D libs_loc="%LIBS%" -D qt_requested=%QT_VER% -D "CMAKE_PREFIX_PATH=%QT_DIR%;%LIBS%\local" -D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH% -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF

      - name: Build Telegram.exe
        run: cmake --build "%TBUILD%\%REPO%\out" --config Debug --target Telegram --parallel

      - name: Collect artifact
        shell: pwsh
        run: |
          $out = "$env:TBUILD\$env:REPO\out\Debug"
          New-Item -ItemType Directory -Force artifact | Out-Null
          foreach ($f in @("Telegram.exe","Updater.exe")) {
            $src = Join-Path $out $f
            if (Test-Path $src) { Copy-Item $src artifact\ }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Enterprise-Win64-${{ github.sha }}
          path: artifact\
          retention-days: 14
          if-no-files-found: warn
